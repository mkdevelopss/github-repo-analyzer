<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repo Analyzer</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="app.css">
<script src="ui.js"></script>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="./" aria-label="Repo Analyzer home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C7A17A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M6 8.5v7M8.5 6h7M18 8.5c0 5-6 4-9.5 8"/></svg>
      <b>Repo Analyzer</b>
    </a>
    <form id="form" class="bar-form" autocomplete="off">
      <label for="url" class="sr">GitHub repository</label>
      <input id="url" class="input" placeholder="github.com/owner/repo" spellcheck="false">
      <button class="btn btn-primary" type="submit">Analyze</button>
    </form>
    <nav aria-label="Views">
      <a href="#report" id="nav-report" aria-current="page">Report</a>
      <a href="#compare" id="nav-compare">Compare</a>
      <span id="rate" class="rate" title="GitHub API calls left this hour"></span>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch light or dark theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <section id="view-report"></section>
  <section id="view-compare" hidden></section>
</main>
<script src="app.js"></script>
</body>
</html>
